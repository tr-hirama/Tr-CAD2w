<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tr-CAD2w</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group">
          <button type="button" data-cmd="new" title="新規">新規</button>
          <button type="button" data-cmd="open" title="開く (Ctrl+O)">開く</button>
          <button type="button" data-cmd="save" title="保存 (Ctrl+S)">保存</button>
          <button type="button" data-cmd="export-dxf" title="DXF で書き出す（UTF-8 / R2007）">DXF書出</button>
          <button type="button" data-cmd="export-dxf-sjis" title="DXF で書き出す（Shift-JIS / R2000。旧 AutoCAD・ZWCAD 向け）">DXF書出SJIS</button>
          <button type="button" data-cmd="export-tc2" title="デスクトップ版 TrCad2D の .tc2 で書き出す">.tc2書出</button>
          <button type="button" data-cmd="print" title="印刷 / PDF出力 (Ctrl+P)">印刷</button>
        </div>
        <div class="group">
          <button type="button" data-cmd="project" title="概要（現場名・概要コード・作業者・備考）">概要</button>
          <button type="button" data-cmd="comments" title="標準注記文を選ぶ">注記文</button>
          <button type="button" data-cmd="comment-text" title="選んだ注記文の本文を直す">注記文の編集</button>
          <button type="button" data-cmd="kyokai" title="境界コメント（境界番号と境界標の種類）を足す">境界コメント</button>
          <button type="button" data-cmd="memo" title="メモ（テキスト）">メモ</button>
          <button type="button" data-cmd="memo-ink" title="手書きメモを描く・消す">手書き</button>
        </div>
        <div class="group">
          <button type="button" data-tool="select" title="選択 (S)">選択</button>
          <button type="button" data-tool="line" title="線 (L)">線</button>
          <button type="button" data-tool="rect" title="矩形 (R)">矩形</button>
          <button type="button" data-tool="circle" title="円 (C)">円</button>
          <button type="button" data-tool="arc" title="円弧 (A)">円弧</button>
          <button type="button" data-tool="polyline" title="連続線 (P)">連続線</button>
          <button type="button" data-tool="point" title="点 (D)">点</button>
          <button type="button" data-tool="text" title="文字 (T)">文字</button>
        </div>
        <div class="group">
          <button type="button" data-tool="hatch" title="閉じた図形をクリックして塗る">ハッチ</button>
          <button type="button" data-cmd="hatch-pattern" title="ハッチのパターンを切り替える">柄</button>
          <button type="button" data-cmd="import-block" title="別図面をブロックとして読み込む">ブロック読込</button>
          <button type="button" data-tool="insert" title="読み込んだブロックを置く">ブロック挿入</button>
          <button type="button" data-cmd="pick-image" title="画像を選んで2点で配置する">画像</button>
          <button type="button" data-tool="dim-linear" title="直線寸法（2点→寸法線位置の3クリック）">寸法</button>
          <button type="button" data-tool="dim-radius" title="半径寸法（円・円弧をクリック）">半径</button>
          <button type="button" data-tool="dim-diameter" title="直径寸法（円・円弧をクリック）">直径</button>
          <button type="button" data-tool="dim-angular" title="角度寸法（頂点→辺1→辺2の3クリック）">角度</button>
          <button type="button" data-cmd="dim-text" title="寸法値を手で書き換える (F2／ダブルクリック)">寸法値</button>
        </div>
        <div class="group">
          <button type="button" data-tool="move" title="移動 (M)">移動</button>
          <button type="button" data-tool="copy" title="複写">複写</button>
          <button type="button" data-cmd="delete" title="削除 (Del)">削除</button>
          <button type="button" data-cmd="undo" title="元に戻す (Ctrl+Z)">元に戻す</button>
          <button type="button" data-cmd="redo" title="やり直し (Ctrl+Shift+Z)">やり直し</button>
        </div>
        <div class="group">
          <button type="button" data-tool="viewport" title="用紙空間に窓を開く（2クリックの矩形）">ビューポート</button>
          <button type="button" data-cmd="vp-scale" title="選択中のビューポートの縮尺・回転を変える">窓の縮尺</button>
          <button type="button" data-cmd="vp-fit" title="選択中のビューポートに図面全体を合わせる">窓に合わせる</button>
          <button type="button" data-cmd="layout-remove" title="開いているレイアウトを削除">レイアウト削除</button>
        </div>
        <div class="group">
          <button type="button" data-cmd="zoom-out" title="ズームアウト (-)">−</button>
          <button type="button" data-cmd="zoom-in" title="ズームイン (+)">＋</button>
          <button type="button" data-cmd="zoom-actual" title="等倍 (1:1)">等倍</button>
          <button type="button" data-cmd="zoom-fit" title="全体表示 (Home)">全体</button>
        </div>
        <div class="group">
          <button type="button" data-cmd="osnap" title="オブジェクト吸着 (F3)">Obj吸着</button>
          <button type="button" data-cmd="gsnap" title="グリッド吸着 (G)">Grid吸着</button>
          <button type="button" data-cmd="bg" title="背景色を切替">背景</button>
          <button type="button" data-cmd="point-style" title="点の表示形状とサイズ（図面全体）">点スタイル</button>
        </div>
      </header>

      <main id="canvas-host">
        <canvas id="canvas"></canvas>
      </main>

      <aside id="sidebar">
        <h2>画層</h2>
        <div id="layer-list"></div>
        <div id="level-panel" hidden>
          <h2>レベル（水準）</h2>
          <div id="level-list"></div>
        </div>
        <h2>操作</h2>
        <ul class="help">
          <li>ホイール = ズーム（カーソル固定）</li>
          <li>中／右ドラッグ = 画面移動</li>
          <li>選択ツールで左ドラッグ = 矩形選択<br />（右→左は交差選択）</li>
          <li>右クリック／Enter = 連続線の確定</li>
          <li>Esc = 取消 / Del = 削除</li>
          <li>Ctrl+Z / Ctrl+Shift+Z = 元に戻す / やり直し</li>
        </ul>
      </aside>

      <nav id="layout-tabs" aria-label="空間の切替"></nav>

      <footer id="statusbar">
        <span id="status">起動しました</span>
        <span id="info"></span>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
